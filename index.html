<body>
<!-- ============================================================
     跳出内嵌浏览器补丁（独立片段，通用版 v5，注入到 <body> 之后）
     作用：FB / IG / TG / 微信 / 抖音 等 APP 内置浏览器里打开本页时，
           自动（Android）或一键（iOS）跳到系统浏览器。
     路由：自动携带当前完整 hash，落地后还原。不假设站内路由格式。
     语言：按手机语言自动切换（英文 / 简体 / 繁体）。
     关闭：地址后加 ?stay=1
     强制：地址后加 ?go=1  —— 投放链接专用，移动端不看 UA 一律尝试跳出
     v3：Telegram 注入对象检测（UA 不可靠）+ ?go=1 强制模式
     v4：iOS 改用系统级 scheme（shortcuts:// 优先，googlechromes:// 兜底）
     v5：整套文案 i18n，按 navigator.language 自动选择
     ============================================================ -->
<style id="xb-style">
#xb{position:fixed;inset:0;z-index:2147483647;display:none;background:rgba(8,8,12,.97);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;color:#f2f2f7;align-items:center;justify-content:center;padding:22px;box-sizing:border-box}

#xb .ico{width:46px;height:46px;border-radius:13px;background:#00e5a0;color:#06110c;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:22px;margin-bottom:15px}

<div id="xb" role="dialog" aria-modal="true" aria-labelledby="xb-t">
  <div class="box">
    <div class="ico">↗</div>
    <h3 id="xb-t">Open in your browser</h3>
    <p id="xb-body">You are viewing this page inside an app's in-app browser. Open it in your system browser for the full experience.</p>
    <a class="cta" id="xb-cta" href="#" rel="noopener">Open in browser</a>
    <a class="alt" id="xb-alt" href="#" rel="noopener">Open in Chrome</a>
    <div class="row">
      <button id="xb-copy" type="button">Copy link</button>
      <button id="xb-close" type="button">Close</button>
    </div>
    <div class="steps" id="xb-steps"></div>
  </div>
</div>
<script>
(function () {
  'use strict';
  var ua = navigator.userAgent || '';
  var isIOS = /iPhone|iPad|iPod/i.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  var isAndroid = /Android/i.test(ua);
  var isMobile = isIOS || isAndroid;

  /* ---------- 0. 语言：跟随手机系统语言 ---------- */
  var rawLang = '';
  try {
    rawLang = (navigator.languages && navigator.languages[0]) || navigator.language ||
      navigator.userLanguage || navigator.browserLanguage || '';
  } catch (e) { rawLang = ''; }
  rawLang = String(rawLang).toLowerCase();
  var LANG = 'en';
  if (rawLang.indexOf('zh') === 0) {
    LANG = /hant|-tw|-hk|-mo|-cht/.test(rawLang) ? 'zht' : 'zh';
  }

  var STR = {
    en: {
      title: 'Open in your browser',
      body1: 'You are viewing this page inside the in-app browser of ',
      body2: '. Some buttons and content may not work properly. Open it in your system browser for the full experience.',
      self: 'this app',
      safari: 'Open in Safari',
      chrome: 'Open in Chrome',
      def: 'Open in default browser',
      open: 'Open link',
      copy: 'Copy link',
      copied: 'Copied',
      close: 'Close',
      skip: 'Continue in this app',
      fbIos: 'If the button does nothing: tap <i>⋯</i> or <i>Share</i> → <i>Open in Safari</i>.',
      fbAndroid: 'If the button does nothing: tap <i>⋯</i> (top right) → <i>Open in browser</i>.',
      ig: 'If the button does nothing: tap <i>⋯</i> (top right) → <i>Open in browser</i>.',
      tgIos: 'If nothing happens: tap <i>⋯</i> (top right) in Telegram → <i>Open in Safari</i>, or tap <i>Copy link</i> below and paste it into Safari.',
      tgAndroid: 'If the button does nothing: tap <i>⋯</i> (top right) → <i>Open in browser</i>, or tap <i>Copy link</i> below and paste it into your browser.',
      block: 'This app blocks direct jumps: tap <i>⋯</i> → <i>Copy link</i>, then paste it into your browser.',
      genericIos: 'If the button does nothing: tap <i>⋯</i> → <i>Open in Safari</i>, or copy the link into Safari.',
      genericAndroid: 'If the button does nothing: use <i>⋯</i> → <i>Open in browser</i>, or copy the link into your browser.',
      desktop: 'Copy the link and open it in your browser.',
      already: 'You are already in a browser — you can browse directly.',
      retryIos: 'Nothing happened. Tap <i>Copy link</i> below and paste it into Safari.',
      retryAndroid: 'Nothing happened. Tap <i>⋯</i> → <i>Open in browser</i>, or tap <i>Copy link</i> below.'
    },
    zh: {
      title: '请用系统浏览器打开',
      body1: '你正在',
      body2: '的内置浏览器中，部分按钮与内容可能无法正常使用。用系统浏览器打开可以获得完整体验。',
      self: '应用',
      safari: '在 Safari 中打开',
      chrome: '用 Chrome 打开',
      def: '在默认浏览器中打开',
      open: '打开链接',
      copy: '复制链接',
      copied: '已复制',
      close: '关闭',
      skip: '继续在应用内浏览',
      fbIos: '按钮没反应：点 <i>⋯</i> 或 <i>分享</i> → <i>在 Safari 中打开</i>。',
      fbAndroid: '按钮没反应：点右上角 <i>⋯</i> → <i>在浏览器中打开</i>。',
      ig: '按钮没反应：点右上角 <i>⋯</i> → <i>在浏览器中打开</i>。',
      tgIos: '按钮没反应：点 Telegram 右上角 <i>⋯</i> → <i>在 Safari 中打开</i>，或点下方「复制链接」粘到 Safari。',
      tgAndroid: '按钮没反应：点右上角 <i>⋯</i> → <i>在浏览器中打开</i>，或点下方「复制链接」粘到浏览器。',
      block: '该应用会拦截直接跳转：点 <i>⋯</i> → <i>复制链接</i>，再打开浏览器粘贴访问。',
      genericIos: '按钮没反应：点 <i>⋯</i> → <i>在 Safari 中打开</i>，或复制链接到 Safari 粘贴。',
      genericAndroid: '按钮没反应：用 <i>⋯</i> 菜单选择「在浏览器中打开」，或复制链接到浏览器粘贴。',
      desktop: '复制链接到浏览器打开即可。',
      already: '你已经在浏览器中，可直接浏览。',
      retryIos: '没有自动跳转。点下方「复制链接」，粘到 Safari 地址栏打开。',
      retryAndroid: '没有自动跳转。点 <i>⋯</i> → <i>在浏览器中打开</i>，或点下方「复制链接」。'
    },
    zht: {
      title: '請用系統瀏覽器開啟',
      body1: '你正在',
      body2: '的內建瀏覽器中，部分按鈕與內容可能無法正常使用。用系統瀏覽器開啟可獲得完整體驗。',
      self: '應用程式',
      safari: '在 Safari 中開啟',
      chrome: '用 Chrome 開啟',
      def: '在預設瀏覽器中開啟',
      open: '開啟連結',
      copy: '複製連結',
      copied: '已複製',
      close: '關閉',
      skip: '繼續在應用程式內瀏覽',
      fbIos: '按鈕沒反應：點 <i>⋯</i> 或 <i>分享</i> → <i>在 Safari 中開啟</i>。',
      fbAndroid: '按鈕沒反應：點右上角 <i>⋯</i> → <i>在瀏覽器中開啟</i>。',
      ig: '按鈕沒反應：點右上角 <i>⋯</i> → <i>在瀏覽器中開啟</i>。',
      tgIos: '按鈕沒反應：點 Telegram 右上角 <i>⋯</i> → <i>在 Safari 中開啟</i>，或點下方「複製連結」貼到 Safari。',
      tgAndroid: '按鈕沒反應：點右上角 <i>⋯</i> → <i>在瀏覽器中開啟</i>，或點下方「複製連結」貼到瀏覽器。',
      block: '此應用程式會攔截直接跳轉：點 <i>⋯</i> → <i>複製連結</i>，再開啟瀏覽器貼上。',
      genericIos: '按鈕沒反應：點 <i>⋯</i> → <i>在 Safari 中開啟</i>，或複製連結到 Safari 貼上。',
      genericAndroid: '按鈕沒反應：用 <i>⋯</i> 選單選擇「在瀏覽器中開啟」，或複製連結到瀏覽器貼上。',
      desktop: '複製連結到瀏覽器開啟即可。',
      already: '你已經在瀏覽器中，可直接瀏覽。',
      retryIos: '沒有自動跳轉。點下方「複製連結」，貼到 Safari 網址列開啟。',
      retryAndroid: '沒有自動跳轉。點 <i>⋯</i> → <i>在瀏覽器中開啟</i>，或點下方「複製連結」。'
    }
  };
  var L = STR[LANG] || STR.en;

  /* ---------- 1. 回程还原：?r=1&h=<编码后的完整hash> -> 原始地址 ---------- */
  try {
    var qs = new URLSearchParams(location.search);
    if (qs.get('r') === '1') {
      var h0 = qs.get('h') || '';
      var clean = location.pathname + (h0 ? '#' + decodeURIComponent(h0) : '');
      try { history.replaceState(null, '', clean); } catch (e) { location.replace(clean); }
    }
  } catch (e) {}

  /* ---------- 2. 识别 APP（UA + 注入对象） ---------- */
  var APP = '', NAME = '';
  if (/FBAN|FBAV|FB_IAB|FB4A|FBIOS|\[FB/i.test(ua)) { APP = 'fb'; NAME = 'Facebook'; }
  else if (/Instagram/i.test(ua)) { APP = 'ig'; NAME = 'Instagram'; }
  else if (/Telegram|TelegramBot/i.test(ua)) { APP = 'tg'; NAME = 'Telegram'; }
  else if (/MicroMessenger/i.test(ua)) { APP = 'wx'; NAME = 'WeChat'; }
  else if (/QQ\//i.test(ua) || /QQBrowser/i.test(ua)) { APP = 'qq'; NAME = 'QQ'; }
  else if (/BytedanceWebview|aweme|TikTok|musical_ly/i.test(ua)) { APP = 'tt'; NAME = 'TikTok'; }
  else if (/Line\//i.test(ua)) { APP = 'line'; NAME = 'LINE'; }
  else if (/Twitter/i.test(ua)) { APP = 'tw'; NAME = 'X'; }
  else if (/Weibo/i.test(ua)) { APP = 'wb'; NAME = 'Weibo'; }
  else if (/; wv\)/i.test(ua)) { APP = 'wv'; NAME = L.self; }

  /* Telegram 的 UA 和普通浏览器一模一样（iOS 更是等于 Safari），
     只能靠它注入的全局对象判断，且仅 Android 的自家 WebView 会注入。 */
  var tgObj = false;
  try {
    tgObj = (typeof window.TelegramWebview !== 'undefined') ||
            (typeof window.TelegramWebviewProxy !== 'undefined') ||
            (typeof window.TelegramWebviewProxyProto !== 'undefined');
  } catch (e) {}
  if (!APP && tgObj) { APP = 'tg'; NAME = 'Telegram'; }

  /* ---------- 3. 强制模式：投放链接带 ?go=1，移动端不看 UA 直接按内置浏览器处理 ---------- */
  var forcedStay = /[?&]stay=1/.test(location.search);
  var FORCE = /[?&](go|bounce)=1/.test(location.search);
  if (FORCE && isMobile && !APP) { APP = 'auto'; NAME = L.self; }

  var INAPP = !!APP;

  /* iOS 进页自动点一次主按钮（实测有效，客户零点击进 Safari）。
     ?auto=0 关掉；用户点过「关闭 / 继续在应用内浏览」后本次会话内不再自动弹。 */
  var AUTO = true;
  if (/[?&]auto=0/.test(location.search)) AUTO = false;
  if (/[?&]auto=1/.test(location.search)) AUTO = true;
  try { if (sessionStorage.getItem('xbStay') === '1' && !/[?&]auto=1/.test(location.search)) AUTO = false; } catch (e) {}
  function markStay() { try { sessionStorage.setItem('xbStay', '1'); } catch (e) {} }

  /* ---------- 4. 带上当前完整 hash，不假设站内路由格式 ---------- */
  function curHash() {
    var h = location.hash || '';
    return h.charAt(0) === '#' ? h.slice(1) : h;
  }
  function targetURL() {
    var h = curHash();
    return location.origin + location.pathname + (h ? '?r=1&h=' + encodeURIComponent(h) : '');
  }
  var bare = function (u) { return u.replace(/^https?:\/\//i, ''); };
  var safariURI = function (u) { return 'x-safari-https://' + bare(u); };
  var chromeIOSURI = function (u) { return 'googlechromes://' + bare(u); };
  /* 实测（iPhone / iOS 18.7 + Telegram iOS）：SFSafariViewController 里点 x-safari-https
     能真的跳到 Safari，一次用户点击即可，不需要装任何捷径。
     若某些机型/版本忽略该 scheme，遮罩底部的「⋯ → 在 Safari 中打开」+ 复制链接仍然兜底。 */
  function intentURI(u, pkg) {
    var m = /^(https?):\/\/([^\/?#]+)([^?#]*)(\?[^#]*)?/i.exec(u);
    if (!m) return u;
    return 'intent://' + m[2] + (m[3] || '/') + (m[4] || '') + '#Intent;scheme=' +
      m[1].toLowerCase() + (pkg ? ';package=' + pkg : '') +
      ';S.browser_fallback_url=' + encodeURIComponent(u) + ';end';
  }

  /* ---------- 5. 绑定 ---------- */
  var box = document.getElementById('xb');
  var cta = document.getElementById('xb-cta');
  var alt = document.getElementById('xb-alt');
  var steps = document.getElementById('xb-steps');
  var titleEl = document.getElementById('xb-t');
  var bodyEl = document.getElementById('xb-body');
  var copyBtn = document.getElementById('xb-copy');
  var closeBtn = document.getElementById('xb-close');
  if (!box || !cta) return;

  /* 文案（跟随系统语言） */
  if (titleEl) titleEl.textContent = L.title;
  if (bodyEl) bodyEl.innerHTML = L.body1 + '<b>' + (NAME || L.self) + '</b>' + L.body2;
  if (copyBtn) copyBtn.textContent = L.copy;
  if (closeBtn) closeBtn.textContent = L.close;
  try { box.setAttribute('lang', LANG === 'en' ? 'en' : (LANG === 'zht' ? 'zh-Hant' : 'zh-Hans')); } catch (e) {}

  function paint() {
    var t = targetURL();
    if (isIOS) {
      cta.href = safariURI(t);
      cta.textContent = L.safari;
      alt.href = chromeIOSURI(t);
      alt.textContent = L.chrome;
      alt.style.display = '';
    } else if (isAndroid) {
      cta.href = intentURI(t, '');
      cta.textContent = L.def;
      alt.href = intentURI(t, 'com.android.chrome');
      alt.textContent = L.chrome;
      alt.style.display = '';
    } else {
      cta.href = t;
      cta.textContent = L.open;
      alt.style.display = 'none';
    }
    var s;
    if (APP === 'fb') s = isIOS ? L.fbIos : L.fbAndroid;
    else if (APP === 'ig') s = L.ig;
    else if (APP === 'tg') s = isIOS ? L.tgIos : L.tgAndroid;
    else if (APP === 'wx' || APP === 'qq' || APP === 'tt') s = L.block;
    else s = isIOS ? L.genericIos : L.genericAndroid;
    if (!isMobile) {
      s = FORCE ? L.already : L.desktop;
      cta.textContent = L.open;
      cta.href = t;
      alt.style.display = 'none';
    }
    steps.innerHTML = s;
  }
  paint();
  window.addEventListener('hashchange', paint);

  function show() { if (!forcedStay) box.classList.add('on'); }
  function hide() { box.classList.remove('on'); }

  /* ---------- 6. iOS：进页自动点一次主按钮 = 零点击进 Safari（已实测有效）；
        没跳走就把遮罩亮出来兜底，并给「⋯ → 在 Safari 中打开 / 复制链接」 ---------- */
  if (INAPP && isIOS) {
    var delay = FORCE ? 60 : 300;
    if (AUTO) {
      setTimeout(function () {
        if (forcedStay) return;
        try { cta.click(); } catch (e) {
          try { location.href = cta.href; } catch (e2) {}
        }
      }, 120);
      setTimeout(function () { if (!document.hidden) show(); }, delay + 900);
    } else {
      setTimeout(show, delay);
    }
  }

  /* ---------- 7. Android：先静默试 intent，没跳走再给遮罩 ---------- */
  if (INAPP && isAndroid) {
    try { location.href = intentURI(targetURL(), ''); } catch (e) {}
    setTimeout(show, FORCE ? 900 : 1600);
    document.addEventListener('visibilitychange', function () {
      if (document.hidden) hide();
    });
  }

  /* ---------- 8. 点了 CTA 还没跳走 -> 立刻升级为手动指引 ---------- */
  cta.addEventListener('click', function () {
    setTimeout(function () {
      if (document.hidden) return;
      if (!box.classList.contains('on')) return;
      steps.innerHTML = isIOS ? L.retryIos : L.retryAndroid;
    }, 1600);
  });

  if (closeBtn) closeBtn.addEventListener('click', function () { markStay(); hide(); });

  if (copyBtn) copyBtn.addEventListener('click', function () {
    var t = targetURL();
    var btn = this;
    var done = function () {
      btn.textContent = L.copied;
      setTimeout(function () { btn.textContent = L.copy; }, 1600);
    };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(t).then(done, function () { legacyCopy(t, done); });
    } else { legacyCopy(t, done); }
  });

  function legacyCopy(text, cb) {
    try {
      var ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      document.execCommand('copy');
      document.body.removeChild(ta);
      cb();
    } catch (e) {}
  }
})();
</script>

{border-top:1px solid var(--line);padding:36px 0;margin-top:40px}\n  .footer__inner{display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap}\n  .footer__brand{font-family:var(--display);font-weight:600;letter-spacing:.08em;font-size:13px}\n  .footer__note{color:var(--faint);font-size:11.5px;margin-top:8px;max-width:62ch;line-height:1.6}\n  .footer__copy{color:var(--faint);font-size:11px}\n\n  @media(max-width:900px){\n    .hero__grid{grid-template-columns:1fr}\n    .mono-stats__grid{grid-template-columns:repeat(2,1fr)}\n    .mstat:nth-child(3){border-left:none}\n    .mstat{border-top:1px solid var(--line)}\n    .mstat:nth-child(-n+2){border-top:none}\n    .steps,.proof,.cases{grid-template-columns:1fr}\n    .step,.proof__cell{border-left:none;border-top:1px solid var(--line)}\n    .step:first-child,.proof__cell:first-child{border-top:none}\n    .log{grid-template-columns:1fr;gap:4px}\n    .log__status{text-align:left}\n    .nav__links a:not(.nav__cta){display:none}\n  }\n\u003c/style>\n\u003c/head>\n\u003cbody>\n\n\u003cdiv class=\"progress\" id=\"progress\">\u003c/div>\n\n\u003cnav class=\"nav\">\n  \u003cdiv class=\"container nav__inner\">\n    \u003ca href=\"#\" class=\"brand\">AUTONOMA \u003cspan>autonomous-capital\u003c/span>\u003c/a>\n    \u003cul class=\"nav__links\">\n      \u003cli>\u003ca href=\"#how\">//how\u003c/a>\u003c/li>\n      \u003cli>\u003ca href=\"#proof\">//proof\u003c/a>\u003c/li>\n      \u003cli>\u003ca href=\"#diagnose\">//diagnose\u003c/a>\u003c/li>\n      \u003cli>\u003ca href=\"#access\" class=\"nav__cta\">$ deploy\u003c/a>\u003c/li>\n    \u003c/ul>\n  \u003c/div>\n\u003c/nav>\n\n\u003cheader class=\"hero\">\n  \u003cdiv class=\"container hero__grid\">\n    \u003cdiv>\n      \u003cdiv class=\"eyebrow rv\">&gt; agentfi / 2026\u003c/div>\n      \u003ch1 class=\"hero__title rv\">The best trader on your payroll \u003cem>isn't human\u003c/em>.\u003c/h1>\n      \u003cp class=\"hero__sub rv\">Autonomous agents now trade, rebalance and act 24/7. Never sleeps. Never blinks. The real question is whose agent is running yours.\u003c/p>\n      \u003cp class=\"hero__note rv\">private network · no public sale · referral only\u003c/p>\n      \u003cdiv class=\"hero__ctas rv\">\n        \u003ca href=\"#diagnose\" class=\"btn btn--primary\">$ diagnose --portfolio\u003c/a>\n        \u003ca href=\"#how\" class=\"btn btn--ghost\">$ cat how-it-works\u003c/a>\n      \u003c/div>\n      \u003cp class=\"hero__note rv\" style=\"margin-top:16px\">on this page → how an agent works · the proof · the diagnostic · the honest part\u003c/p>\n    \u003c/div>\n    \u003cdiv class=\"term rv\">\n      \u003cdiv class=\"term__bar\">\u003cspan class=\"term__dot term__dot--r\">\u003c/span>\u003cspan class=\"term__dot term__dot--y\">\u003c/span>\u003cspan class=\"term__dot term__dot--g\">\u003c/span>\u003cspan class=\"term__title\">aur-01 — session\u003c/span>\u003c/div>\n      \u003cdiv class=\"term__body\" id=\"term\">\u003c/div>\n    \u003c/div>\n  \u003c/div>\n\u003c/header>\n\n\u003csection class=\"mono-stats\">\n  \u003cdiv class=\"container mono-stats__grid\">\n    \u003cdiv class=\"mstat\">\u003cdiv class=\"mstat__label\">uptime\u003c/div>\u003cdiv class=\"mstat__num\">24/7\u003c/div>\u003cdiv class=\"mstat__sub\">no sleep, no blink, no hesitation\u003c/div>\u003c/div>\n    \u003cdiv class=\"mstat\">\u003cdiv class=\"mstat__label\">emotions\u003c/div>\u003cdiv class=\"mstat__num\">0\u003c/div>\u003cdiv class=\"mstat__sub\">no panic-selling, no FOMO\u003c/div>\u003c/div>\n    \u003cdiv class=\"mstat\">\u003cdiv class=\"mstat__label\">latency\u003c/div>\u003cdiv class=\"mstat__num\">&lt;1s\u003c/div>\u003cdiv class=\"mstat__sub\">to act on signals humans miss\u003c/div>\u003c/div>\n    \u003cdiv class=\"mstat\">\u003cdiv class=\"mstat__label\">era\u003c/div>\u003cdiv class=\"mstat__num\">2026\u003c/div>\u003cdiv class=\"mstat__sub\">capital stopped being a day job\u003c/div>\u003c/div>\n  \u003c/div>\n\u003c/section>\n\n\u003csection class=\"section\" id=\"how\">\n  \u003cdiv class=\"container\">\n    \u003cdiv class=\"section__label rv\">how it works\u003c/div>\n    \u003ch2 class=\"section__title rv\">Execution, not advice.\u003c/h2>\n    \u003cp class=\"section__lede rv\">A chatbot tells you what it thinks. An agent does something about it — in three moves.\u003c/p>\n    \u003cdiv class=\"steps rv\">\n      \u003cdiv class=\"step\">\u003cdiv class=\"step__num\">01\u003c/div>\u003cdiv class=\"step__title\">Deploy\u003c/div>\u003cdiv class=\"step__text\">Connect your keys, draw your risk guardrails. The agent only acts inside the lines you set.\u003c/div>\u003c/div>\n      \u003cdiv class=\"step\">\u003cdiv class=\"step__num\">02\u003c/div>\u003cdiv class=\"step__title\">Configure\u003c/div>\u003cdiv class=\"step__text\">Choose what it optimizes for — yield, risk, drawdown. One command, no code.\u003c/div>\u003c/div>\n      \u003cdiv class=\"step\">\u003cdiv class=\"step__num\">03\u003c/div>\u003cdiv class=\"step__title\">Run\u003c/div>\u003cdiv class=\"step__text\">It executes 24/7. You watch the log — or don't. It never blinks.\u003c/div>\u003c/div>\n    \u003c/div>\n  \u003c/div>\n\u003c/section>\n\n\u003csection class=\"section\" id=\"proof\">\n  \u003cdiv class=\"container\">\n    \u003cdiv class=\"section__label rv\">the proof\u003c/div>\n    \u003ch2 class=\"section__title rv\">Numbers, not promises.\u003c/h2>\n    \u003cp class=\"section__lede rv\">Illustrative network metrics — the kind of thing a manual portfolio can't print.\u003c/p>\n    \u003cdiv class=\"proof rv\">\n      \u003cdiv class=\"proof__cell\">\u003cdiv class=\"proof__num\" data-count=\"1240\">0\u003c/div>\u003cdiv class=\"proof__label\">agents deployed\u003c/div>\u003c/div>\n      \u003cdiv class=\"proof__cell\">\u003cdiv class=\"proof__num\" data-count=\"84\" data-prefix=\"$\" data-suffix=\"M\">$0\u003c/div>\u003cdiv class=\"proof__label\">on-chain volume routed\u003c/div>\u003c/div>\n      \u003cdiv class=\"proof__cell\">\u003cdiv class=\"proof__num\" data-count=\"3.1\" data-dec=\"1\" data-suffix=\"M\">0\u003c/div>\u003cdiv class=\"proof__label\">executions settled\u003c/div>\u003c/div>\n      \u003cdiv class=\"proof__cell\">\u003cdiv class=\"proof__num\" data-count=\"99.97\" data-dec=\"2\" data-suffix=\"%\">0\u003c/div>\u003cdiv class=\"proof__label\">agent uptime\u003c/div>\u003c/div>\n    \u003c/div>\n    \u003cdiv class=\"proof__foot rv\" style=\"margin-top:10px\">Illustrative. Past performance doesn't predict future results.\u003c/div>\n\n    \u003cdiv class=\"cases rv\">\n      \u003cdiv class=\"case\">\u003cdiv class=\"case__tag\">AUR-01 · Rebalance\u003c/div>\u003cdiv class=\"case__metric\">18 mo\u003c/div>\u003cdiv class=\"case__text\">kept portfolio drift under 2% through the choppiest stretch in years.\u003c/div>\u003cdiv class=\"case__quote\">\"Set it, forgot it. It rebalanced while I slept.\" — private client\u003c/div>\u003c/div>\n      \u003cdiv class=\"case\">\u003cdiv class=\"case__tag\">AUR-02 · Yield\u003c/div>\u003cdiv class=\"case__metric\">3.1M\u003c/div>\u003cdiv class=\"case__text\">executions across a treasury ladder that runs itself.\u003c/div>\u003cdiv class=\"case__quote\">\"I haven't touched it since March.\" — private client\u003c/div>\u003c/div>\n      \u003cdiv class=\"case\">\u003cdiv class=\"case__tag\">AUR-03 · Hedge\u003c/div>\u003cdiv class=\"case__metric\">&lt;1s\u003c/div>\u003cdiv class=\"case__text\">drawdown reaction time — faster than any human on the desk.\u003c/div>\u003cdiv class=\"case__quote\">\"The exit fired before I even saw the news.\" — private client\u003c/div>\u003c/div>\n    \u003c/div>\n  \u003c/div>\n\u003c/section>\n\n\u003csection class=\"section\" id=\"diagnose\">\n  \u003cdiv class=\"container container--narrow\">\n    \u003cdiv class=\"section__label rv\">the diagnostic\u003c/div>\n    \u003ch2 class=\"section__title rv\">Which agent should run your capital?\u003c/h2>\n    \u003cp class=\"section__lede rv\">Four questions. Answer honestly. See where you sit between manual and fully autonomous.\u003c/p>\n    \u003cdiv class=\"check rv\">\n      \u003cdiv class=\"check__bar\">\u003cdiv class=\"check__prog\">\u003cdiv class=\"check__fill\" id=\"pf\">\u003c/div>\u003c/div>\u003cspan class=\"check__count\" id=\"pc\">0 / 4\u003c/span>\u003c/div>\n      \u003cdiv id=\"q\">\u003c/div>\n      \u003cdiv id=\"result\" class=\"result\">\u003c/div>\n    \u003c/div>\n  \u003c/div>\n\u003c/section>\n\n\u003csection class=\"section\" id=\"dive\">\n  \u003cdiv class=\"container container--narrow\">\n    \u003cdiv class=\"section__label rv\">the deep dive\u003c/div>\n    \u003ch2 class=\"section__title rv\">What an agent actually does, second by second\u003c/h2>\n    \u003cdiv class=\"prose rv\">\n      \u003cp class=\"kicker\">&gt; the loop\u003c/p>\n      \u003ch3>Observe → decide → execute → settle.\u003c/h3>\n      \u003cp>Most of what you call \"trading\" is really just \u003cstrong>waiting\u003c/strong>. You wait to see the signal, wait to be free, wait for confirmation, wait to place the order. An agent removes the waiting. The loop — read the market, decide, size the position, settle it — runs in \u003ccode>&lt;1s\u003c/code>, around the clock. As of late 2026, the fastest loops on Solana and Base settle faster than a human can blink.\u003c/p>\n      \u003cp>Here's the shape of it. At 02:14 UTC a perp funding rate flips negative. A human is asleep. The agent reads the signal, sizes a hedge, and is flat before the candle closes. That isn't \"AI magic\" — it's a \u003cstrong>decision rule you set in advance\u003c/strong>, executed without hesitation or emotion.\u003c/p>\n      \u003cp>The part most people miss: an agent doesn't have opinions. It has \u003cstrong>constraints\u003c/strong>. You give it an objective — \"keep drawdown under a 6% vol cap\" — and guardrails: position limits, stop-losses, a kill-switch. It optimizes inside the lines. It never gets greedy, never gets scared, never gets tired.\u003c/p>\n      \u003cp>Stripped of hype, the pitch is one sentence: \u003cstrong>capital that keeps executing your rules when you can't.\u003c/strong> The question was never whether to automate. It's whose agent, and what rules.\u003c/p>\n    \u003c/div>\n  \u003c/div>\n\u003c/section>\n\n\u003csection class=\"section\" id=\"honest\">\n  \u003cdiv class=\"container container--narrow\">\n    \u003cdiv class=\"section__label rv\">the honest part\u003c/div>\n    \u003ch2 class=\"section__title rv\">Who this is for — and isn't\u003c/h2>\n    \u003cdiv class=\"honest rv\">\n      \u003ch3>Read this before anything else.\u003c/h3>\n      \u003cul>\n        \u003cli>Agents make mistakes. A fast mistake is still a mistake. Guardrails limit damage; they don't eliminate it.\u003c/li>\n        \u003cli>This is not a fund, not custody, not advice. It's automation infrastructure. Your capital stays yours.\u003c/li>\n        \u003cli>Smart-contract and model risk are real. Past performance — ours or anyone's — doesn't predict the future.\u003c/li>\n        \u003cli>If you need a human to talk to, or you can't stomach 24/7 autonomy, this isn't for you.\u003c/li>\n        \u003cli>For accredited / sophisticated investors only. If you have to ask what that means, it's probably not for you.\u003c/li>\n      \u003c/ul>\n    \u003c/div>\n  \u003c/div>\n\u003c/section>\n\n\u003csection class=\"section\" id=\"faq\">\n  \u003cdiv class=\"container container--narrow\">\n    \u003cdiv class=\"section__label rv\">the questions\u003c/div>\n    \u003ch2 class=\"section__title rv\">Asked, answered.\u003c/h2>\n    \u003cdiv class=\"faq rv\">\n      \u003cdetails>\u003csummary>Who controls the agent?\u003c/summary>\u003cp>You hold the keys. Agents execute inside guardrails you set — position limits, stop-losses, and a human-override kill-switch at all times.\u003c/p>\u003c/details>\n      \u003cdetails>\u003csummary>Do I need to be technical?\u003c/summary>\u003cp>No. But AUTONOMA is for accredited / sophisticated investors only, by referral.\u003c/p>\u003c/details>\n      \u003cdetails>\u003csummary>What's the minimum?\u003c/summary>\u003cp>It's private. No public minimum is published — access is by referral.\u003c/p>\u003c/details>\n      \u003cdetails>\u003csummary>How is risk handled?\u003c/summary>\u003cp>Pre-set position limits, stop-losses, and a kill-switch. The agent can't act outside the lines you draw.\u003c/p>\u003c/details>\n      \u003cdetails>\u003csummary>What happens in a crash?\u003c/summary>\u003cp>The agent executes your pre-set rules without panic. No emotion, no hesitation — that's the point.\u003c/p>\u003c/details>\n      \u003cdetails>\u003csummary>Is AUTONOMA a fund?\u003c/summary>\u003cp>No. It's automation infrastructure. Your capital stays yours; the agent just runs it.\u003c/p>\u003c/details>\n    \u003c/div>\n  \u003c/div>\n\u003c/section>\n\n\u003csection class=\"section\" id=\"reading\">\n  \u003cdiv class=\"container container--narrow\">\n    \u003cdiv class=\"reading__label rv\">keep reading\u003c/div>\n    \u003cdiv class=\"reading__grid rv\">\n      \u003ca class=\"reading-card\" href=\"#p=article-1\">\u003cdiv class=\"reading-card__tag\">the thesis\u003c/div>\u003cdiv class=\"reading-card__title\">Why manual trading has already lost\u003c/div>\u003cdiv class=\"reading-card__more\">It isn't skill — it's latency and attention. →\u003c/div>\u003c/a>\n      \u003ca class=\"reading-card\" href=\"#p=article-2\">\u003cdiv class=\"reading-card__tag\">field log\u003c/div>\u003cdiv class=\"reading-card__title\">A day in the life of an agent\u003c/div>\u003cdiv class=\"reading-card__more\">24 hours, hour by hour. →\u003c/div>\u003c/a>\n    \u003c/div>\n  \u003c/div>\n\u003c/section>\n\n\u003csection class=\"section\" id=\"access\">\n  \u003cdiv class=\"container container--narrow\">\n    \u003cdiv class=\"section__label rv\">private access\u003c/div>\n    \u003ch2 class=\"section__title rv\">Request the agent network\u003c/h2>\n    \u003cp class=\"section__lede rv\">AUTONOMA is private and by referral. Leave your details and we'll be in touch with the next steps. No spam.\u003c/p>\n    \u003cform class=\"report-form rv\" action=\"https://formspree.io/f/YOUR_FORM_ID\" method=\"POST\">\n      \u003cinput type=\"text\" name=\"name\" placeholder=\"&gt; your name\" aria-label=\"Name\" required>\n      \u003cinput type=\"email\" name=\"email\" placeholder=\"&gt; email address\" aria-label=\"Email\" required>\n      \u003cbutton type=\"submit\" class=\"btn btn--primary\">$ request-access\u003c/button>\n    \u003c/form>\n    \u003cp class=\"report-note rv\">no spam. your data is private. unsubscribe anytime.\u003c/p>\n  \u003c/div>\n\u003c/section>\n\n\u003cfooter class=\"footer\">\n  \u003cdiv class=\"container footer__inner\">\n    \u003cdiv>\n      \u003cdiv class=\"footer__brand\">AUTONOMA · Autonomous Capital\u003c/div>\n      \u003cp class=\"footer__note\">Nothing on this page is financial advice. Autonomous agents involve substantial risk, including loss of principal. Past performance does not predict future results. For accredited / sophisticated investors only.\u003c/p>\n    \u003c/div>\n    \u003cdiv class=\"footer__copy\">© 2026 AUTONOMA — exit\u003c/div>\n  \u003c/div>\n\u003c/footer>\n\n\u003cscript>\n  // progress bar\n  var pb=document.getElementById('progress');\n  window.addEventListener('scroll',function(){var h=document.documentElement;var sc=h.scrollTop||document.body.scrollTop;var m=h.scrollHeight-h.clientHeight;pb.style.width=(m>0?sc/m*100:0)+'%';},{passive:true});\n\n  // reveal\n  var io=new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target);}})},{threshold:.12});\n  document.querySelectorAll('.rv').forEach(function(el){io.observe(el)});\n\n  // count-up\n  function countUp(el){var t=parseFloat(el.dataset.count);var dec=parseInt(el.dataset.dec||'0',10);var pre=el.dataset.prefi — and the market no longer waits for either.\">\n\u003clink rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n\u003clink rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin>\n\u003clink href=\"https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500&display=swap\" rel=\"stylesheet\">\n\u003cstyle>\n:root{--bg:#08080a;--navbg:rgba(8,8,10,.85);--text:#e7e7ee;--muted:#9a9aa6;--faint:#575762;--accent:#00e5a0;--accent2:#8b7bff;--border:#20202a;--display:\"Space Grotesk\",Inter,sans-serif;--body:\"Inter\",-apple-system,\"SF Pro Text\",\"Segoe UI\",sans-serif}\n*{margin:0;padding:0;box-sizing:border-box}\nhtml{scroll-behavior:smooth}\nbody{background:var(--bg);color:var(--text);font-family:var(--body);-webkit-font-smoothing:antialiased;line-height:1.75}\na{color:inherit;text-decoration:none}\n.container{max-width:720px;margin:0 auto;padding:0 24px}\n.progress{position:fixed;top:0;left:0;height:3px;background:var(--accent);width:0;z-index:60}\n.nav{position:sticky;top:0;z-index:50;background:var(--navbg);backdrop-filter:blur(14px);border-bottom:1px solid var(--border)}\n.nav__inner{display:flex;align-items:center;justify-content:space-between;height:58px}\n.brand{font-family:var(--display);font-weight:700;letter-spacing:.18em;font-size:15px}\n.brand small{font-family:var(--body);font-weight:400;font-size:10px;color:var(--faint);letter-spacing:.1em}\n.nav__back{font-size:13px;color:var(--muted)}\n.nav__back:hover{color:var(--accent)}\n.article-head{padding:72px 0 16px}\n.article-head__tag{font-size:11px;letter-spacing:.28em;text-transform:uppercase;color:var(--accent);margin-bottom:18px}\n.article-head__title{font-family:var(--display);font-weight:700;font-size:clamp(30px,4.6vw,48px);line-height:1.1;letter-spacing:-.02em}\n.article-head__dek{font-size:19px;color:var(--muted);margin-top:20px;line-height:1.6}\n.article-meta{display:flex;gap:16px;font-size:12.5px;color:var(--faint) u003c/div>\n\u003c/nav>\n\n\u003cheader class=\"article-head\">\n  \u003cdiv class=\"container\">\n    \u003cdiv class=\"article-head__tag\">AgentFi · The Thesis\u003c/div>\n    \u003ch1 class=\"article-head__title\">Why manual trading has already lost\u003c/h1>\n    \u003cp class=\"article-head__dek\">It isn't about skill. It's about latency and attention — and the market no longer waits for either.\u003c/p>\n    \u003cdiv class=\"article-meta\">\u003cspan>6 min read\u003c/span>\u003cspan>Updated Nov 2026\u003c/span>\u003c/div>\n  \u003c/div>\n\u003c/header>\n\n\u003carticle class=\"article-body\">\n  \u003cdiv class=\"container\">\n    \u003cp class=\"lead\">At 02:14 UTC, a perp funding rate flips negative. Somewhere, an agent reads the signal, sizes a hedge, and is flat before the candle closes. A human — a good one, with years of experience and a sharp thesis — is asleep. That single hour, repeated nightly, is the whole argument in miniature.\u003c/p>\n\n    \u003cp>For a long time we told ourselves trading was a contest of \u003cstrong>judgment\u003c/strong>. The better analyst, the better read, the better gut. That was true once, when markets moved at the speed of a newspaper and everyone read the same tape at the same time. It is not true anymore.\u003c/p>\n\n    \u003ch2>The bottleneck is you\u003c/h2>\n    \u003cp>Markets run 24/7. Your attention doesn't. You sleep, you eat, you take calls, you have a life. Every hour your capital is unattended, it's not being managed — it's being \u003cstrong>parked\u003c/strong>. And in a market that never closes, parked capital is leaking capital.\u003c/p>\n\n    \u003cp>This isn't a moral failing. It's biology. Attention is the scarcest input in your entire process, and you're paying the full price of it: every missed signal, every slow reaction, every \"I'll handle it in the morning.\"\u003c/p>\n\n    \u003ch2>Latency is the real edge\u003c/h2>\n    \u003cp>Most of what looks like skill in modern markets is just \u003cstrong>speed\u003c/strong>. The signal was visible to everyone. The edge wasn't seeing it — it was acting on it first. A sub-second response beats a same-day response every single time, not because it's smarter, but because it got the price first.\u003c/p>\n\n    \u003cp>You can train judgment for a decade and still be slower than code that was written last week. That isn't a knock on you. It's a property of the game now.\u003c/p>\n\n    \u003cdiv class=\"pull\">You don't lose to a better trader. You lose to one that never sleeps.\u003c/div>\n\n    \u003ch2>Emotion is a tax\u003c/h2>\n    \u003cp>Panic-selling at the bottom, FOMO at the top, revenge-trading after a loss. These aren't character flaws — they're \u003cstrong>defaults\u003c/strong>. Every human trader pays them, some occasionally, some constantly. The tax shows up in the drawdowns, in the exits made too late, in the entries made too hot.\u003c/p>\n\n    \u003cp>An agent doesn't feel any of it. Not because it's disciplined, but because it has no feeling to overcome. It executes the rule you set in advance, identically, at 02:14 or 14:00.\u003c/p>\n\n    \u003ch2>What automation actually changes\u003c/h2>\n    \u003cp>The pitch is not \"AI is smarter than you.\" It's simpler: \u003cstrong>your rules, executed without you\u003c/strong>. The position limits, the stop-losses, the rebalancing thresholds — all the decisions you already know you should make — run around the clock, whether you're at your desk or not.\u003c/p>\n\n    \u003cp>The question was never whether to automate. It was whose agent, and what rules. The people still doing it by hand aren't wrong about their thesis. They're just paying the attention tax, every single night, while the market moves on without them.\u003c/p>\n  \u003c/div>\n\u003c/article>\n\n\u003csection class=\"keep\">\n  \u003cdiv class=\"container\">\n    \u003cdiv class=\"keep__label\">Keep reading\u003c/div>\n    \u003cdiv class=\"keep__grid\">\n      \u003ca class=\"keep- all>\u003c/a>\n    \u003ca href=\"#p=home\" class=\"nav__back\">← back\u003c/a>\n  \u003c/div>\n\u003c/nav>\n\n\u003cheader class=\"article-head\">\n  \u003cdiv class=\"container\">\n    \u003cdiv class=\"article-head__tag\">AgentFi · Field Log\u003c/div>\n    \u003ch1 class=\"article-head__title\">A day in the life of an agent\u003c/h1>\n    \u003cp class=\"article-head__dek\">24 hours, hour by hour. What an autonomous agent actually does while you sleep.\u003c/p>\n    \u003cdiv class=\"article-meta\">\u003cspan>4 min read\u003c/span>\u003cspan>Updated Nov 2026\u003c/span>\u003c/div>\n  \u003c/div>\n\u003c/header>\n\n\u003carticle class=\"article-body\">\n  \u003cdiv class=\"container\">\n    \u003cp class=\"lead\">The best way to understand an agent is to stop reading about it and watch it. This is a reconstructed day — one agent, one portfolio, twenty-four hours. Nothing dramatized. The whole point is how ordinary it is.\u003c/p>\n\n    \u003ch2>00:00 – 06:00 · You're asleep. It isn't.\u003c/h2>\n    \u003cp>The Asian session is moving. The agent rebalances a treasury ladder that drifted past its threshold — a trade you'd have made at 9am, if the drift hadn't already cost you by then. It logs the fill, updates the position, moves on.\u003c/p>\n    \u003cp>At 02:14 a funding rate flips negative on a perp position. The agent reads it, sizes a hedge, and is flat before the candle closes. No alarm goes off. No one wakes up. That's the point.\u003c/p>\n\n    \u003ch2>06:00 – 12:00 · The open\u003c/h2>\n    \u003cp>You're waking up. The agent has already been working for six hours. It took profit on a position that hit its target overnight, moved the proceeds into a stable yield, and reset a stop-loss that was too tight after the last run.\u003c/p>\n    \u003cp>By the time you look at your phone, the thing that would have demanded your attention is already done. The agent didn't need you to be awake. It needed your rules — which you set once, in advance.\u003c/p>\n\n    \u003cdiv class=\"pull\">It didn't need you to be awake. It needed your rules.\u003c/div>\n\n    \u003ch2>12:00 – 18:00 · The quiet hours\u003c/h2>\n    \u003cp>Most of a market's day is noise. The agent mostly does nothing — which is exactly right. It monitors volatility, checks drawdown against the cap you set, and waits. Boredom is a feature, not a bug. The agent doesn't trade for the sake of trading.\u003c/p>\n\n    \u003ch2>18:00 – 24:00 · The decisions you'd regret\u003c/h2>\n    \u003cp>Evening. A headline hits, the kind that used to make you sell at the low or buy the top. The agent checks the position against its constraints and finds nothing to do. Your rules said \"hold.\" So it holds.\u003c/p>\n    \u003cp>It's 23:47. You're asleep again. The agent executes the overnight rebalance it runs every day at this hour — the same trade, the same logic, the same discipline, whether the market is calm or crashing. Tomorrow, the log will show one more day where nothing important got missed.\u003c/p>\n\n    \u003cp>That's all an agent is. Not magic. Just your rules, kept running while you live your life.\u003c/p>\n  \u003c/div>\n\u003c/article>\n\n\u003csection class=\"keep\">\n  \u003cdiv class=\"container\">\n    \u003cdiv class=\"keep__label\">Keep reading\u003c/div>\n    \u003cdiv class=\"keep__grid\">\n      \u003ca class=\"keep-card\" href=\"#p=article-1\">\u003cdiv class=\"keep-card__tag\">The thesis\u003c/div>\u003cdiv class=\"keep-card__title\">Why manual trading has already lost\u003c/div>\u003cdiv class=\"keep-card__more\">Latency and attention →\u003c/div>\u003c/a>\n      \u003ca class=\"keep-card\" href=\"#p=home\">\u003cdiv class=\"keep-card__tag\">Overview\u003c/div>\u003cdiv class=\"keep-card__title\">Back to AUTONOMA\u003c/div>\u003cdiv class=\"keep-card__more\">The landing page →\u003c/div>\u003c/a>\n    \u003c/div>\n  \u003c/div>\n\u003c/section>\n\n\u003cfooter class=\"footer\">\n  \u003cdiv class=\"container footer__inner\">\n    \u003cdiv>\n
