<style>
  *{margin:0;padding:0;box-sizing:border-box}

  .ad__headline{font-family:"Space Grotesk",Inter,sans-serif;font-weight:600;font-size:8.8cqw;line-height:1.08;letter-spacing:-.02em}
  .ad__headline em{font-style:normal;color:#8b7bff}
  .ad__sub{font-size:3.3cqw;line-height:1.5;color:#a1a1a6;margin-top:5cqw}

  .ad__bottom{display:flex;flex-direction:column;align-items:flex-start;gap:3cqw}
  .ad__cta{background:#7c5cff;color:#fff;font-size:3cqw;font-weight:500;padding:2.6cqw 5.2cqw;border-radius:100px;white-space:nowrap}
  .ad__note{font-size:2.4cqw;color:#8e8e96;letter-spacing:.02em}

  .ad--11 .ad__headline{font-size:7.6cqw}
  .ad--11 .ad__sub{margin-top:4cqw;font-size:3.1cqw}
